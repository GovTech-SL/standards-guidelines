site_name: GovTech Sri Lanka Technology Standards
site_description: Standards and Guidelines Repository
site_url: https://govtech-sl.github.io/standards-guidelines/

theme:
  name: material
  logo: assets/govtech-logo.svg
  favicon: assets/govtech-favicon.png

nav:
